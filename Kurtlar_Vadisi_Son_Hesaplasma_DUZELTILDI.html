<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kurtlar Vadisi — Son Hesaplaşma</title><style>
:root{--gold:#d5b77a;--ink:#090c11;--panel:#141b24;--line:#68573d;--muted:#a7b0b8}*{box-sizing:border-box}body{margin:0;background:#06080d;color:#f4eee4;font-family:Georgia,'Times New Roman',serif;min-height:100vh}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #f4d58b;outline-offset:3px}.app{max-width:1600px;margin:auto;min-height:100vh;background:radial-gradient(ellipse at 60% 0%,#1b2b3b,#080a0e 70%);display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 22px;border-bottom:1px solid #695537;background:#090c11e8;flex-wrap:wrap}.brand{font-size:22px;letter-spacing:2px;color:#f2e5cb}.brand small{display:block;color:#a63e3e;font:11px Arial;letter-spacing:5px;margin-top:3px}.hud{display:flex;gap:14px;flex-wrap:wrap;font:13px Arial;color:#d7c4a3}.hud b{color:#fff}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav button,.minor{background:#1c222a;color:#e6d6b8;border:1px solid #514733;padding:9px 13px;border-radius:4px}.nav button:hover,.minor:hover{background:#373023}.layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px;padding:18px;flex:1}.main{min-width:0}.stage{height:clamp(270px,37vw,535px);border:1px solid #756040;position:relative;overflow:hidden;background:linear-gradient(180deg,#0b1524,#151821 60%,#0b090b)}.stage:before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#06070bd9,transparent 35%,#04060933),radial-gradient(circle at 67% 27%,#b8864752,transparent 29%);pointer-events:none;z-index:2}.stage .city{position:absolute;bottom:0;width:100%;height:48%;background:repeating-linear-gradient(90deg,transparent 0 27px,#151b25 27px 53px,#090e17 53px 68px);clip-path:polygon(0 26%,7% 26%,7% 5%,13% 5%,13% 39%,20% 39%,20% 13%,27% 13%,27% 34%,33% 34%,33% 0,40% 0,40% 29%,48% 29%,48% 10%,55% 10%,55% 30%,63% 30%,63% 4%,70% 4%,70% 38%,78% 38%,78% 15%,86% 15%,86% 34%,93% 34%,93% 9%,100% 9%,100% 100%,0 100%);opacity:.8}.stage .city:after{content:'';position:absolute;inset:0;background-image:radial-gradient(#e0ac62 1px,transparent 1px);background-size:19px 24px;opacity:.6}.stage.office{background:linear-gradient(110deg,#251a17,#0d1522 58%,#30251f)}.stage.gallery{background:linear-gradient(140deg,#0c1117,#1d2932 60%,#30231d)}.stage.court{background:linear-gradient(120deg,#25231e,#121b24 70%,#373125)}.stage.docks{background:linear-gradient(180deg,#142536,#080c16 65%,#182a35)}.stage.cafe{background:linear-gradient(110deg,#39271c,#151a1c 65%,#27170f)}.stage.rescue{background:linear-gradient(120deg,#28333b,#0d151c 65%,#49382b)}.stage.mansion{background:linear-gradient(110deg,#2c1f1b,#0a101c 65%,#302519)}.stage.final{background:linear-gradient(135deg,#251016,#0b1119 65%,#402322)}.place{position:absolute;top:19px;left:22px;z-index:5;font:12px Arial;letter-spacing:2px;color:#d9b979;text-transform:uppercase;background:#090c11c9;padding:9px 12px;border-left:3px solid #a73b3b}.chapter{position:absolute;top:62px;left:22px;z-index:5;font-size:26px;text-shadow:0 3px 10px #000}.figure{position:absolute;bottom:-22px;width:31%;height:79%;filter:drop-shadow(0 0 24px #000);z-index:1}.figure.left{left:8%}.figure.right{right:8%;transform:scaleX(-1)}.head{position:absolute;top:0;left:32%;width:36%;height:30%;border-radius:45% 45% 43% 43%;background:linear-gradient(100deg,#6e4a38,#c08d68 42%,#624134 90%);box-shadow:inset 0 13px #1d1718}.hair{position:absolute;top:-4%;left:31%;width:38%;height:15%;border-radius:55% 55% 30% 30%;background:#161619}.torso{position:absolute;top:28%;left:7%;width:86%;height:80%;background:linear-gradient(95deg,#080b10 10%,#2a2d31 48%,#0a0d11 90%);clip-path:polygon(22% 0,43% 7%,50% 26%,57% 7%,78% 0,100% 21%,100% 100%,0 100%,0 21%);border-radius:20px}.shirt{position:absolute;top:28%;left:44%;width:12%;height:46%;background:#ddd0ba;clip-path:polygon(0 0,50% 20%,100% 0,75% 100%,25% 100%)}.figure.woman .hair{height:30%;top:-3%;background:#1d1618}.figure.elder .head{background:linear-gradient(100deg,#786354,#c2a48a,#64544a)}.figure.elder .hair{background:#b0a79d}.figure.orange .torso{background:linear-gradient(90deg,#7a3b1c,#d77d30,#713314)}.scene-overlay{position:absolute;inset:0;z-index:3;background:linear-gradient(0deg,#06080dc9,transparent 44%)}.dialogue{border:1px solid #67563d;border-top:0;background:linear-gradient(120deg,#131b24,#090c11);padding:20px 24px;min-height:130px}.speaker{color:var(--gold);font-size:23px;margin-bottom:9px}.line{font-size:19px;line-height:1.65;min-height:55px}.choices{display:grid;gap:9px;margin-top:13px}.choice{width:100%;text-align:left;padding:13px 17px;color:#f3e7d2;background:linear-gradient(90deg,#25211c,#151b23);border:1px solid #79613e;border-radius:4px;font-size:17px;transition:.15s}.choice:hover{background:#473b2a;transform:translateX(3px)}.footer{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}.hint{color:#a5a9ae;font:12px Arial}.side{background:#10151c;border:1px solid #574b3b;padding:17px;height:fit-content}.side h3{font-size:21px;color:#dec28e;margin:4px 0 14px}.person{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #30343b;padding:9px 0;font:14px Arial}.person small{color:#b8a68a}.meter{height:5px;background:#2c333b;margin-top:6px;border-radius:5px;overflow:hidden}.meter span{display:block;height:100%;background:linear-gradient(90deg,#8c6139,#d7bb77)}.log{font:13px Arial;color:#b8bfc6;line-height:1.7;max-height:170px;overflow:auto}.modal{position:fixed;inset:0;background:#030508dc;z-index:30;display:flex;align-items:center;justify-content:center;padding:15px}.modal[hidden]{display:none}.sheet{width:min(720px,100%);max-height:85vh;overflow:auto;background:#151b23;border:1px solid #947447;box-shadow:0 20px 80px #000;padding:27px}.sheet h2{color:#d9ba81;margin-top:0}.sheet p{line-height:1.6}.sheet .person{padding:13px 0}.start{max-width:800px;margin:8vh auto;padding:50px 30px;text-align:center;background:linear-gradient(160deg,#111922,#080a0f);border:1px solid #7b613e}.start h1{font-size:clamp(34px,5vw,65px);margin:10px 0;letter-spacing:3px}.start h2{color:#b74848;letter-spacing:8px}.start p{color:#c7c3bc;line-height:1.8}.primary{padding:14px 26px;border:1px solid #bb9b60;background:linear-gradient(#5b3d2a,#30201d);color:#fff0d4;font-size:18px;margin:8px}.end{padding:20px;background:#251e1b;border-left:3px solid #d1aa6c;margin-top:10px;line-height:1.6}.toast{position:fixed;bottom:24px;right:24px;background:#243023;border:1px solid #9bba78;color:#e7f1df;padding:12px 18px;z-index:50;font:14px Arial;max-width:340px}.toast[hidden]{display:none}@media(max-width:850px){.layout{grid-template-columns:1fr}.side{order:2}.stage{height:320px}.figure{width:40%}.line{font-size:17px}.brand{font-size:18px}}
</style></head><body><div id="root"></div><div id="modal" class="modal" hidden><div class="sheet" id="sheet"></div></div><div class="toast" id="toast" hidden></div><script>
'use strict';
const PEOPLE={polat:'Polat Alemdar',memati:'Memati Baş',cakir:'Süleyman Çakır',ziya:'Laz Ziya',fatih:'Veznedar Fatih',nehir:'AFAD Nehir',ercan:'Ercan Dayı',enes:'Galerici Enes',erdal:'Yakışıklı Erdal',mesut:'Kâtip Mesut'};
const chapters=['Karanlık Para','Galerideki İz','Çakır’ın Masası','Kayıp Dosya','Kurtarma Hattı','İki Yüzlü Dost','Laz Ziya’nın Şartı','Eski Defter','İçimizdeki Adam','Son Hesaplaşma'];
const scenes={};function add(id,chapter,place,bg,speaker,text,choices,others=[]){scenes[id]={id,chapter,place,bg,speaker,text,choices,others}}function C(label,to,effect={},req=null){return{label,to,effect,req}};
add('s1',1,'Polat’ın Ofisi','office','memati','Abi, üç ayrı şirketten aynı gece para çıkmış. Veznedar Fatih bunu fark etmiş. Enes’in galerisinden çıkan siyah bir araba da bu işin içinde.',[C('Fatih’i çağırıp hesapları incelet.','s2',{intel:12,trust:{fatih:12},flags:['fatihFirst']}),C('Kâtip Mesut’a eski dosyaları açtır.','s3',{intel:15,trust:{mesut:12},flags:['mesutFirst']}),C('Önce Ercan Dayı’nın fikrini al.','s4',{rep:8,trust:{ercan:12},flags:['ercanFirst']})],['polat','memati']);
add('s2',1,'Vezne Odası','office','fatih','Polat Bey, rakamlar birbirini tutmuyor. Parayı gönderen şirketin sahibi altı yıl önce ölmüş görünüyor. Ben bu evrakları sakladım.',[C('Evrakları güvenli kasaya al.','s5',{intel:12,trust:{fatih:8},flags:['ledger']}),C('Fatih’i korumaya al, önce can güvenliği.','s5',{loyal:8,trust:{fatih:17},flags:['protectFatih']})],['polat','fatih']);
add('s3',1,'Adliye Arşivi','court','mesut','Bu dosyanın numarası doğru ama sayfaları eksik. Üstelik son işlem tarihi dün. Biri eski bir dosyayı yeniden açmış.',[C('Eksik sayfaların izini sür.','s5',{intel:15,trust:{mesut:8},flags:['archive']}),C('Mesut’u geri çek, dosyayı gizli tut.','s5',{loyal:5,trust:{mesut:15},flags:['protectMesut']})],['polat','mesut']);
add('s4',1,'Eski Kahvehane','cafe','ercan','Evlat, herkes paranın peşine düşer. Ben parayı kimin saydığını sorarım. O defter yıllar önce bir masayı dağıttı.',[C('Dayı’dan isim iste.','s5',{intel:8,trust:{ercan:6},flags:['dayiName']}),C('Sözüne güven, acele etme.','s5',{rep:10,trust:{ercan:15},flags:['dayiTrust']})],['polat','ercan']);
add('s5',1,'Polat’ın Ofisi','office','polat','Üç yol da aynı yere çıkıyor: Enes’in galerisine. Fakat bu kez oraya nasıl gideceğimize karar vermeliyiz.',[C('Memati ile doğrudan görüşmeye git.','s6',{loyal:7,rep:5,flags:['directEnes']}),C('Önce Erdal’ı araya sok.','s6',{trust:{erdal:13},flags:['erdalMediator']})],['polat','memati']);
add('s6',2,'Enes’in Galerisi','gallery','enes','Polat Bey, ben araba satarım. Alıcının sırrını değil. Ama o siyah araç teslim edildiği gece bir daha geri dönmedi.',[C('Enes’e dürüstçe ortaklık öner.','s7',{trust:{enes:20},cash:-5000,flags:['enesAlly']}),C('Aracın kayıtlarını iste, baskı yapma.','s7',{intel:12,trust:{enes:4},flags:['carRecords']}),C('Memati’ye galeriyi izlettir.','s7',{risk:12,trust:{enes:-12},flags:['enesWatched']})],['polat','enes']);
add('s7',2,'Galerinin Arka Odası','gallery','erdal','Ben bu plakayı tanıyorum. Aracı alan adam, Çakır’ın adamlarıyla da görüşmüş. Ama bir şey daha var: aynı kişi Laz Ziya’nın konağına girmiş.',[C('Erdal’a güven, birlikte Çakır’a git.','s8',{trust:{erdal:13},flags:['trustErdal']}),C('Bilgiyi Mesut’a doğrulat.','s8',{intel:15,trust:{mesut:8},flags:['verifyErdal']})],['polat','erdal']);
add('s8',3,'Çakır’ın Masası','cafe','cakir','Polat, benim adımın geçtiği her iş benim işim değildir. Bu defteri açarsan eski dostların bile karşına dikilir.',[C('Çakır’a açık ittifak teklif et.','s9',{trust:{cakir:23},rep:8,flags:['cakirAlly']}),C('İlk önce belgeleri göstermesini iste.','s9',{intel:12,trust:{cakir:-8},flags:['cakirDoubt']}),C('Bu işten uzak durmasını söyle.','s9',{risk:12,trust:{cakir:-20},flags:['cakirRival']})],['polat','cakir']);
add('s9',3,'Gece Yolu','docks','memati','Abi, Çakır’ın masasından kalkınca peşimize biri takıldı. Plaka, Enes’in verdiği kayıtla uyuşuyor. Birileri bizi izliyor.',[C('Takipçiyi atlat, arşive yönel.','s10',{intel:9,flags:['evade']}),C('Takip edenle konuşmayı dene.','s10',{rep:7,risk:7,flags:['confront']})],['polat','memati']);
add('s10',4,'Adliye Koridoru','court','mesut','Buldum! Eski dosyanın eksik sayfasında bir depo adresi var. Fakat depoda geçen hafta yangın çıkmış. Olay yerine AFAD Nehir gitmiş.',[C('Nehir’le bizzat görüş.','s11',{trust:{nehir:12},flags:['meetNehir']}),C('Önce olay tutanağını incele.','s11',{intel:16,flags:['fireReport']})],['polat','mesut']);
add('s11',5,'Afet Koordinasyon Merkezi','rescue','nehir','Ben Nehir. Yangından sonra depoda hasarlı bir çelik kutu bulduk. İçinde kısmen yanmış bir defter vardı. Resmî tutanağa da işledim.',[C('Nehir’den tutanağın bir örneğini iste.','s12',{intel:18,trust:{nehir:15},flags:['nehirEvidence']}),C('Nehir’in güvenliğini öncele.','s12',{loyal:10,trust:{nehir:23},flags:['protectNehir']})],['polat','nehir']);
add('s12',5,'Eski Depo','rescue','polat','Defterde bir kod var: K-24. Aynı kod Fatih’in hesaplarında da geçiyor. Şimdi birinin konuşması gerekiyor.',[C('Fatih ile Nehir’i aynı masada buluştur.','s13',{intel:12,trust:{fatih:5,nehir:5},flags:['crossCheck']}),C('Kodu tek başına çözmeye çalış.','s13',{intel:7,rep:7,flags:['soloCode']})],['polat','nehir']);
add('s13',6,'Gece Toplantısı','office','erdal','Polat, sana bir anlaşma getirdim. Defterin geri kalanını verecekler. Karşılığında Enes’in işine karışmayacaksın. Bu fırsat bir daha gelmez.',[C('Anlaşmayı kabul et, şartları yazılı al.','s14',{cash:30000,trust:{erdal:15,enes:8},flags:['erdalDeal']}),C('Reddet, Erdal’ın kimle görüştüğünü araştır.','s14',{intel:20,trust:{erdal:-22},flags:['erdalSuspect']}),C('Erdal’a sahte bir bilgi vererek sınama yap.','s14',{intel:13,risk:8,flags:['erdalTest']})],['polat','erdal']);
add('s14',6,'Polat’ın Ofisi','office','memati','Abi, verdiğimiz bilgi başka birine ulaşmış. Aramızda sızıntı var. Yanlış kişiyi suçlarsak ekibi dağıtırız.',[C('Erdal’ı sorgula.','s15',{trust:{erdal:-14},flags:['accuseErdal']}),C('Enes’i sorgula.','s15',{trust:{enes:-16},flags:['accuseEnes']}),C('Kimseyi suçlama, delil toplamaya devam et.','s15',{intel:17,loyal:10,flags:['patient']})],['polat','memati']);
add('s15',7,'Laz Ziya’nın Konağı','mansion','ziya','Delikanlı, bu şehirde herkes bir şey bilir. Ama herkes bildiğini söylemez. Bana bir neden göster ki bu meselede senin yanında durayım.',[C('Elde ettiğin delilleri paylaş.','s16',{trust:{ziya:19},intel:-5,flags:['ziyaEvidence']},'intel>=35'),C('Çakır ile ortak hareket etmeyi öner.','s16',{trust:{ziya:13,cakir:6},rep:12,flags:['ziyaCakir']},'trust.cakir>=45'),C('Hiçbir pazarlık yapmadan ayrıl.','s16',{rep:14,trust:{ziya:-15},flags:['ziyaRefused']})],['polat','ziya']);
add('s16',8,'Ercan Dayı’nın Evi','cafe','ercan','K-24 bir şirket değil, eski bir toplantının kodu. O gece masada altı kişi vardı. Biri hâlâ yaşıyor ve bütün ipleri o tutuyor.',[C('Dayı’dan o kişinin adını öğren.','s17',{intel:18,trust:{ercan:8},flags:['bossName']}),C('Dayı’yı koru, ismi başka kaynaktan bul.','s17',{loyal:12,trust:{ercan:18},flags:['dayiProtected']})],['polat','ercan']);
add('s17',8,'Gizli Arşiv','court','mesut','K-24’ün son imzasını buldum. Belgeler aynı gece iki ayrı adrese gitmiş. Biri liman, diğeri eski bir konak. Bu bir tuzak da olabilir.',[C('Limana git, hızlı davran.','s18',{risk:12,intel:5,flags:['routePort']}),C('Konağı incele, önce hazırlık yap.','s18',{intel:13,rep:5,flags:['routeMansion']})],['polat','mesut']);
add('s18',9,'Gece Yarısı','docks','memati','Abi, elimizdeki bilgiler birbirini tamamlıyor. Ama birileri bize yanlış iz bıraktı. Son toplantıdan önce kime güveneceğimizi seçmeliyiz.',[C('Memati ve Çakır’la ilerle.','s19',{loyal:15,trust:{cakir:7},flags:['teamCakir']},'trust.cakir>=45'),C('Fatih, Mesut ve Nehir’in delillerine dayan.','s19',{intel:20,flags:['teamEvidence']}),C('Ercan Dayı ve Laz Ziya’nın bağlantılarını kullan.','s19',{rep:16,flags:['teamElders']},'trust.ziya>=35')],['polat','memati']);
add('s19',9,'Son Hazırlık','office','polat','Bu gece kimin dost olduğu belli olacak. Herkesin önünde tek bir soru soracağım: Kara Defter’i kim sakladı?', [C('Delilleri açıkça ortaya koy.','s20',{intel:8,rep:8,flags:['openEvidence']}),C('Gizli bir toplantı düzenle.','s20',{loyal:9,risk:-5,flags:['secretMeeting']})],['polat','memati']);
add('s20',10,'Son Hesaplaşma','final','ziya','Polat Alemdar… Bütün yollar buraya çıktı. Önündeki belgeler bir düzeni yıkabilir. Ama o düzenin yerine ne koyacağını düşün.',[C('Belgeleri hukuki makamlara teslim et.','ending',{rep:22,intel:8,flags:['legalEnding']}),C('Dostlarınla birlikte gizli yapıyı dağıt.','ending',{loyal:18,rep:10,flags:['allianceEnding']}),C('Önce içerideki köstebeği ifşa et.','ending',{intel:14,risk:8,flags:['traitorEnding']})],['polat','ziya']);
const key='kv_son_hesaplasma_save_v1';let state=null;const defaultState=()=>({scene:'s1',cash:25000,rep:35,intel:15,loyal:70,risk:15,trust:{memati:90,cakir:48,ziya:30,fatih:45,nehir:45,ercan:45,enes:35,erdal:35,mesut:50},flags:[],history:[],visited:[],sound:false});const $=s=>document.querySelector(s);function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){}}function load(){try{let a=JSON.parse(localStorage.getItem(key));if(a&&scenes[a.scene]||a&&a.scene==='ending')return a}catch(e){}return null}function cap(n){return Math.max(0,Math.min(100,n))}function toast(s){let t=$('#toast');t.textContent=s;t.hidden=false;clearTimeout(window._toast);window._toast=setTimeout(()=>t.hidden=true,2800)}function requirement(r){if(!r)return true;let m=r.match(/^trust\.(\w+)>=(\d+)$/);if(m)return(state.trust[m[1]]||0)>=+m[2];m=r.match(/^(intel|rep|loyal|cash)>=(\d+)$/);return m?state[m[1]]>=+m[2]:false}function effect(e){let notes=[];for(let k of ['cash','rep','intel','loyal','risk'])if(e[k]){state[k]=k==='cash'?Math.max(0,state[k]+e[k]):cap(state[k]+e[k]);notes.push(({cash:'Para',rep:'İtibar',intel:'İstihbarat',loyal:'Sadakat',risk:'Tehlike'})[k]+' '+(e[k]>0?'+':'')+e[k])}if(e.trust)for(let[k,v]of Object.entries(e.trust)){state.trust[k]=cap((state.trust[k]||40)+v);notes.push((PEOPLE[k]||k)+' güven '+(v>0?'+':'')+v)}if(e.flags)for(let f of e.flags)if(!state.flags.includes(f))state.flags.push(f);if(notes.length)toast(notes.slice(0,3).join(' • '))}function select(i){let s=scenes[state.scene],c=s.choices[i];if(!c||!requirement(c.req))return;if(c.effect.cash<0&&state.cash<Math.abs(c.effect.cash)){toast('Bu karar için yeterli paran yok.');return}state.history.push({scene:state.scene,choice:c.label});effect(c.effect);state.scene=c.to;save();render()}function chapterNum(){return scenes[state.scene]?.chapter||10}function figure(id,side){if(!id)return'';return `<div class="figure ${side} ${id==='ercan'||id==='ziya'?'elder':''} ${id==='nehir'?'orange':''}"><div class="torso"></div><div class="shirt"></div><div class="head"></div><div class="hair"></div></div>`}function render(){let root=$('#root');if(!state){root.innerHTML=`<div class="app"><header class="top"><div class="brand">KURTLAR VADİSİ<small>SON HESAPLAŞMA</small></div></header><div class="start"><div style="font-size:56px">♛</div><h1>KURTLAR VADİSİ</h1><h2>SON HESAPLAŞMA</h2><p>İstanbul'da gizlenen Kara Defter'in izini sür. Polat Alemdar olarak kararlar ver, dostlarını seç, ihanetleri ortaya çıkar ve hesaplaşmanın sonunu belirle.</p><button class="primary" onclick="newGame()">▶ YENİ OYUN</button><button class="primary" onclick="continueGame()">↻ DEVAM ET</button><p style="font-size:13px">Tek dosya • Çevrimdışı • Chrome • Otomatik kayıt</p></div></div>`;return}let s=scenes[state.scene],end=state.scene==='ending';root.innerHTML=`<div class="app"><header class="top"><div class="brand">KURTLAR VADİSİ<small>SON HESAPLAŞMA</small></div><div class="nav"><button onclick="openPanel('team')">Ekibim</button><button onclick="openPanel('intel')">İstihbarat</button><button onclick="openPanel('history')">Geçmiş</button><button onclick="openPanel('settings')">Ayarlar</button></div><div class="hud"><span>₺ <b>${state.cash.toLocaleString('tr-TR')}</b></span><span>★ İtibar <b>${state.rep}</b></span><span>◈ İstihbarat <b>${state.intel}</b></span><span>♜ Sadakat <b>${state.loyal}</b></span></div></header><div class="layout"><main class="main">${end?endingHTML():`<div class="stage ${s.bg}"><div class="city"></div>${figure(s.others[0]||s.speaker,'left')}${figure(s.others[1],'right')}<div class="scene-overlay"></div><div class="place">${safe(s.place)}</div><div class="chapter">Bölüm ${s.chapter} — ${safe(chapters[s.chapter-1])}</div></div><div class="dialogue"><div class="speaker">${safe(PEOPLE[s.speaker])}</div><div class="line">“${safe(s.text)}”</div></div><div class="choices">${s.choices.map((c,i)=>`<button class="choice" ${requirement(c.req)?'':'disabled title="Bu seçenek için yeterli ilişki veya istihbarat yok" style="opacity:.35"'} onclick="select(${i})">${i+1}. ${safe(c.label)}${requirement(c.req)?'':' 🔒'}</button>`).join('')}</div>`}<div class="footer"><span class="hint">Kararların otomatik kaydedilir. • Bölüm ${chapterNum()} / 10</span><div><button class="minor" onclick="toggleSound()">${state.sound?'♫ Gerilim sesi: Açık':'♪ Gerilim sesi: Kapalı'}</button> <button class="minor" onclick="openPanel('settings')">Kaydet / Yükle</button></div></div></main><aside class="side"><h3>Ekibim ve İlişkiler</h3>${Object.entries(PEOPLE).filter(([k])=>k!=='polat').map(([k,v])=>`<div class="person"><div>${safe(v)}<div class="meter"><span style="width:${state.trust[k]||0}%"></span></div></div><small>${state.trust[k]||0}/100</small></div>`).join('')}<h3 style="margin-top:24px">Son Kararlar</h3><div class="log">${state.history.length?state.history.slice(-4).reverse().map(h=>`<div>• ${safe(h.choice)}</div>`).join(''):'Henüz bir karar verilmedi.'}</div></aside></div></div>`;if(state.sound)startAudio()}function endingHTML(){let alliance=state.flags.includes('allianceEnding'),legal=state.flags.includes('legalEnding');let good=state.intel>=75&&state.loyal>=60;let title=good?(legal?'ADALETİN DEFTERİ':alliance?'BÜYÜK İTTİFAK':'KÖSTEBEĞİN SONU'):(state.risk>=65?'KARANLIK SON':'YALNIZ KURT');let desc=good?'Polat, Kara Defter’in arkasındaki ağı ortaya çıkardı. Toplanan deliller ve kurulan ittifaklar, yıllardır saklanan düzenin dağılmasını sağladı.':state.risk>=65?'Gerçeklerin bir bölümü ortaya çıktı, ancak sızıntılar ve yanlış kararlar ekibi böldü. Büyük hesaplaşma henüz bitmedi.':'Polat, çok az kişiye güvenerek gerçeğe ulaştı. Zafer kazanıldı, fakat bazı dostluklar geride kaldı.';let traitor=state.flags.includes('erdalSuspect')||state.flags.includes('erdalTest')?'Erdal’ın çelişkili ifadeleri ortaya çıkarıldı.':'Erdal’ın bağlantıları son ana kadar kuşku yarattı.';return `<div class="stage final"><div class="city"></div>${figure('polat','left')}<div class="scene-overlay"></div><div class="place">SEZON FİNALİ</div><div class="chapter">${title}</div></div><div class="dialogue"><div class="speaker">SON HESAPLAŞMA</div><div class="line">${desc}</div><div class="end">${traitor}<br>İtibar: ${state.rep} • İstihbarat: ${state.intel} • Sadakat: ${state.loyal}<br>Verilen karar: ${safe(state.history.at(-1)?.choice||'')}</div></div><div class="choices"><button class="choice" onclick="newGame()">↻ Farklı kararlarla yeniden oyna</button><button class="choice" onclick="openPanel('history')">Karar geçmişini incele</button></div>`}function newGame(){if(state&&!confirm('Yeni oyun mevcut ilerlemeyi sıfırlar. Devam edilsin mi?'))return;state=defaultState();save();render()}function continueGame(){let a=load();if(!a){toast('Kayıt bulunamadı. Yeni oyun başlat.');return}state=a;render()}function openPanel(type){let m=$('#modal'),sh=$('#sheet');m.hidden=false;let html='<button class="minor" style="float:right" onclick="closePanel()">✕ Kapat</button>';if(type==='team'){html+='<h2>Karakter İlişkileri</h2><p>Güven puanları seçimlerinle değişir. Düşük puan, karakterin mutlaka hain olduğu anlamına gelmez.</p>'+Object.entries(PEOPLE).filter(([k])=>k!=='polat').map(([k,v])=>`<div class="person"><span>${safe(v)}</span><span>${state.trust[k]||0}/100 — ${(state.trust[k]||0)>=65?'Yakın':(state.trust[k]||0)>=40?'Temkinli':'Şüpheli'}</span></div>`).join('')}if(type==='intel'){html+='<h2>İstihbarat Dosyası</h2><p>Toplam istihbarat: '+state.intel+'</p><p>İpuçları ve kazanımlar:</p>'+ (state.flags.length?state.flags.map(f=>'<div class="person">◆ '+safe(({ledger:'Şüpheli hesap defteri',archive:'Adliye arşivindeki iz',carRecords:'Araç satış kayıtları',nehirEvidence:'Yangın tutanağı',bossName:'K-24 imzasının izi',crossCheck:'Çapraz doğrulama',fireReport:'Yangın raporu'}[f]||f.replace(/([A-Z])/g,' $1')))+'</div>').join(''):'Henüz belge toplanmadı.')}if(type==='history'){html+='<h2>Karar Geçmişi</h2>'+(state.history.length?state.history.map((h,i)=>`<div class="person">${i+1}. Bölüm ${scenes[h.scene]?.chapter||'?'}: ${safe(h.choice)}</div>`).join(''):'Henüz karar yok.')}if(type==='settings'){html+='<h2>Oyun Ayarları</h2><p>Oyun her seçimden sonra otomatik kaydedilir. Chrome’da dosya üzerinden açıldığında kayıtların tarayıcıya göre silinme ihtimaline karşı dışa aktarabilirsin.</p><button class="primary" onclick="exportSave()">Kayıt dosyasını indir</button><button class="primary" onclick="document.getElementById(\'importFile\').click()">Kayıt dosyası yükle</button><input id="importFile" type="file" accept=".json" style="display:none" onchange="importSave(event)"><hr style="border-color:#514733"><button class="minor" onclick="toggleSound();closePanel()">Gerilim sesini aç / kapat</button><button class="minor" onclick="closePanel();newGame()">Yeni oyun</button>'}sh.innerHTML=html}function closePanel(){$('#modal').hidden=true}$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closePanel()});function exportSave(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='son-hesaplasma-kayit.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function importSave(e){let f=e.target.files?.[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!x||(!scenes[x.scene]&&x.scene!=='ending')||!x.trust||!Array.isArray(x.history)||!Array.isArray(x.flags))throw Error();state=x;save();closePanel();render();toast('Kayıt yüklendi')}catch(err){alert('Geçersiz kayıt dosyası.')}}let audioCtx=null,osc=[],audioTimer=null;function startAudio(){if(audioCtx||!state?.sound)return;try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();let master=audioCtx.createGain();master.gain.value=.025;master.connect(audioCtx.destination);[55,82.4,110].forEach((hz,i)=>{let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=hz;g.gain.value=i===0?.5:.18;o.connect(g).connect(master);o.start();osc.push(o)});let t=0;audioTimer=setInterval(()=>{if(audioCtx){let now=audioCtx.currentTime;osc[1].frequency.setTargetAtTime(80+Math.sin(t++/3)*6,now,.5)}},800)}catch(e){state.sound=false}}function stopAudio(){clearInterval(audioTimer);osc.forEach(o=>{try{o.stop()}catch(e){}});osc=[];if(audioCtx)audioCtx.close();audioCtx=null}function toggleSound(){state.sound=!state.sound;if(state.sound)startAudio();else stopAudio();save();render()}document.addEventListener('keydown',e=>{if($('#modal').hidden&&state&&scenes[state.scene]&&/^[1-3]$/.test(e.key)&&!e.ctrlKey&&!e.altKey){let i=Number(e.key)-1;if(scenes[state.scene].choices[i]&&requirement(scenes[state.scene].choices[i].req))select(i)}if(e.key==='Escape')closePanel()});render();
</script></body></html>
